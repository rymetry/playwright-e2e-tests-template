name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Design Doc／spec整合・skill構造・型検査。追加設定なしで常時実行する
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Node同梱のnpmはpackage.jsonのdevEngines（npm >=11.10.0、onFail: error）を
      # 満たさないため、packageManagerに固定したversionを導入する
      - run: npm install -g npm@11.18.0
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck

  # E2E実行はrepository variables（E2E_CI=true、E2E_BASE_URL、E2E_ALLOWED_ORIGINS）を
  # 設定した場合のみ有効化する。テンプレート直後はテスト0件で失敗するため、
  # 最初の実ケースをACTIVEにしてから有効化する（README「CI」参照）
  e2e:
    needs: verify
    if: ${{ vars.E2E_CI == 'true' }}
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_ALLOWED_ORIGINS: ${{ vars.E2E_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.18.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
